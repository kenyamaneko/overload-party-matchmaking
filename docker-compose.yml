# matchmaking のローカル開発スタック。構成と使い方は `make help` を参照。
name: overload-party-matchmaking

# publish する topic 名は matchmaking 本体と pubsub-init の双方が参照するため、ここで一度だけ定義する。
x-match-made-topic: &match_made_topic matchmaking-events

services:
  # サービス名は env 変数 (UPSTASH_REDIS_URL) との整合のため redis のままにしているが、
  # 実体は Valkey (BSD-3, Redis 7.2 系フォーク)。RESP/Lua は Redis と 100% 互換。
  redis:
    image: valkey/valkey:8-alpine
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 10

  pubsub-emulator:
    image: gcr.io/google.com/cloudsdktool/google-cloud-cli:emulators
    command: >
      gcloud beta emulators pubsub start
      --project=overload-party-local
      --host-port=0.0.0.0:8085
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8085 || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 20

  # matchmaking は matchmaking-events topic へ publish する。publish 先が無いと送信が失敗するため起動前に用意する。
  pubsub-init:
    image: gcr.io/google.com/cloudsdktool/google-cloud-cli:emulators
    depends_on:
      pubsub-emulator:
        condition: service_healthy
    environment:
      PUBSUB_EMULATOR_HOST: pubsub-emulator:8085
      PUBSUB_PROJECT_ID: overload-party-local
      MATCH_MADE_TOPIC: *match_made_topic
    volumes:
      - ./docker/pubsub/init-topics.sh:/init-topics.sh:ro
    entrypoint: ["/bin/bash", "/init-topics.sh"]
    restart: "no"

  matchmaking:
    image: golang:1.25-alpine
    working_dir: /src
    command: go run ./cmd/server
    depends_on:
      redis:
        condition: service_healthy
      pubsub-init:
        condition: service_completed_successfully
    environment:
      CGO_ENABLED: "0"
      # module cache を host から ro マウントするため、コンテナ内 fetch を禁止し cache 欠落を即エラーにする。解決は host 側 (make run の go mod download) が担う。
      GOPROXY: "off"
      GOPRIVATE: github.com/kenyamaneko/*
      # bind-mount が持ち込む host の go.work は sibling をローカル overlay するが、コンテナに sibling は無い。無効化し go.mod の公開版で解決させる。
      GOWORK: "off"
      APP_ENV: local
      PORT: "9004"
      UPSTASH_REDIS_URL: redis://redis:6379
      GOOGLE_CLOUD_PROJECT_ID: overload-party-local
      # 対になる秘密鍵でトークンを発行するため、e2e のローカルスタックと同じ公開鍵を置く。
      INTERNAL_AUTH_PUBLIC_KEY: |
        -----BEGIN PUBLIC KEY-----
        MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEAtonwE0LCBQAsbZk6fcso
        ZOW3i3CohQfVQy3yn7gQV/Pv5roZWT2Ao45zhRqwZ8tv+mmZ8PbxU4NNQ9u2Orvq
        /njIX/CdILUfYcGFg3eiQeuA/f8dqB1uE+OtbvZBZit4uBHwJl+47oVO7Ow7w4F1
        GNoJuVnOB8ilY8rzB+HDgSJZgwycllxYoXl8pIACsbwqxPYY4YFnUf9lI1baAxao
        Rf4daUKB8oe7ym2MwRtobvPZoB0lBeO/igeW4uqcdv5gDbF6OwTkiOdWBosl1HDA
        0TK9+HtuniNd3M9kKyIWslxvpinn79eMAQfcnI9S1zuhh1vRuhMQ/u8WdAvM54AN
        AQIDAQAB
        -----END PUBLIC KEY-----
      MATCH_MADE_TOPIC: *match_made_topic
      MATCHMAKING_CIRCUIT_THRESHOLD: "5"
      MATCHMAKING_CIRCUIT_COOLDOWN_SEC: "30"
      MATCHMAKING_DRAIN_TIMEOUT_SEC: "10"
      PUBSUB_EMULATOR_HOST: pubsub-emulator:8085
    volumes:
      - ./:/src
      - ${HOST_GOMODCACHE:?make run 経由で起動すること (go env GOMODCACHE を渡す必要がある)}:/go/pkg/mod:ro
      - matchmaking_gobuild:/root/.cache/go-build
    ports:
      - "9004:9004"

volumes:
  matchmaking_gobuild:
