# ─── Endpoint definitions ────────────────────────────────
# REST API エンドポイント定義。generate_types.py が docs/API_REFERENCE.md を生成する。
endpoint_groups:
  - name: Internal REST
    base_path: /internal/v1
    auth: internal
    description: ClusterIP 内部のみ到達可能。gateway が WS メッセージを変換して呼び出す。
    endpoints:
      - method: POST
        path: /internal/v1/enqueue
        summary: プレイヤーをマッチングキューに追加
        request_type: EnqueueRequest
        response_status: 202
        response_description: "Accepted（レスポンスボディなし）"
        errors:
          - status: 400
            description: playerId または deckId が空・不正
          - status: 503
            description: Redis 接続エラー
        notes: 冪等ではない。同一プレイヤーを二重 enqueue すると ZADD で上書きされる。

      - method: POST
        path: /internal/v1/cancel
        summary: プレイヤーをマッチングキューから除外
        request_type: CancelRequest
        response_status: 200
        response_description: "OK（レスポンスボディなし）"
        errors:
          - status: 400
            description: playerId が空・不正
          - status: 404
            description: プレイヤーがキューに存在しない
          - status: 503
            description: Redis 接続エラー
        notes: 冪等。存在しない場合は 404 を返す。

      - method: GET
        path: /internal/v1/queue-size
        summary: 現在のマッチングキューサイズを取得
        response_type: QueueSizeResponse
        errors:
          - status: 503
            description: Redis 接続エラー

      - method: GET
        path: /internal/v1/health
        summary: ヘルスチェック（サーキットブレーカー状態を含む）
        response_description: '`{"status":"ok","circuit":"closed"}` または `{"status":"degraded","circuit":"open"}`'
        errors:
          - status: 503
            description: サーキットブレーカーが open 状態

  - name: Pub/Sub イベント
    description: マッチング成立時に Cloud Pub/Sub へ publish されるイベント。HTTP エンドポイントではない。
    endpoints:
      - method: PUBLISH
        path: "topic: matchmaking-events"
        summary: マッチング成立イベントを Pub/Sub に publish
        response_type: MatchMadeEvent
        notes: |
          Exactly-Once delivery。gateway の全 Pod が competing consumer として subscribe する。
          publish 失敗時はペアを元の JoinedAt で re-enqueue し、最大 5 回指数バックオフでリトライする。
