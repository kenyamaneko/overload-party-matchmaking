openapi: 3.0.3
info:
  title: overload-party-matchmaking
  version: 0.1.0
  description: |
    Matchmaking service の REST 契約 (gateway → matchmaking の internal API および k8s probe)。
    本ファイルが SSoT。`packages/api-matchmaking` の Go 型は oapi-codegen が本ファイルから生成する。

    エンドポイント分類 (ADR-037 Phase 3):
    - `/internal/v1/enqueue` / `/internal/v1/cancel`: gateway が `X-Internal-Auth` (HS256 JWT) を
      付けて呼ぶ player-scoped API。player_id は sub クレームから解決し body には含めない
    - `/internal/v1/queue-size` / `/internal/v1/health`: 認証不要の運用 / probe 系

paths:
  /internal/v1/enqueue:
    post:
      operationId: enqueuePlayer
      summary: プレイヤーをマッチングキューに追加
      description: |
        gateway が WS `matchmaking_start` メッセージを変換して呼び出す。
        冪等ではない (同一プレイヤーを二重 enqueue すると ZADD で上書きされる)。
      security:
        - InternalAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnqueueRequest"
      responses:
        "202":
          description: Accepted (レスポンスボディなし)
        "400":
          description: deck_id が空・不正
        "401":
          description: 認証失敗
        "503":
          description: Redis 接続エラー

  /internal/v1/cancel:
    post:
      operationId: cancelPlayer
      summary: プレイヤーをマッチングキューから除外
      description: 冪等。存在しない場合は 404 を返す。
      security:
        - InternalAuth: []
      responses:
        "200":
          description: OK (レスポンスボディなし)
        "401":
          description: 認証失敗
        "404":
          description: プレイヤーがキューに存在しない
        "503":
          description: Redis 接続エラー

  /internal/v1/queue-size:
    get:
      operationId: getQueueSize
      summary: 現在のマッチングキューサイズを取得
      responses:
        "200":
          description: 現在のキューサイズ
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueueSizeResponse"
        "503":
          description: Redis 接続エラー

  /internal/v1/health:
    get:
      operationId: getHealth
      summary: ヘルスチェック (サーキットブレーカー状態を含む)
      description: |
        k8s liveness/readiness probe からも参照される。
        circuit が open のときは 503 を返し k8s がトラフィックをドレインする。
      responses:
        "200":
          description: 正常 (circuit closed)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "503":
          description: degraded (circuit open)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

components:
  securitySchemes:
    InternalAuth:
      type: apiKey
      in: header
      name: X-Internal-Auth
      description: gateway が発行する HS256 JWT。sub クレームに player_id を含む。

  schemas:
    EnqueueRequest:
      type: object
      required: [deck_id]
      properties:
        deck_id:
          type: integer
          format: int64
          x-go-name: DeckID
          description: Deck id the player queued with.

    QueueSizeResponse:
      type: object
      required: [size]
      properties:
        size:
          type: integer
          format: int64
          description: Current ZCARD of matchmaking:queue.

    HealthResponse:
      type: object
      required: [status, circuit]
      properties:
        status:
          type: string
          description: "ok / degraded"
          example: ok
        circuit:
          type: string
          description: "closed / open"
          example: closed
