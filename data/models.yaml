# matchmaking モデル定義 SSoT
# packages/api-matchmaking/*_gen.go の生成元

files:
  - path: packages/api-matchmaking/rest_gen.go
    package: apimatchmaking
    types:
      - name: EnqueueRequest
        doc: |
          Body of POST /internal/v1/enqueue. Gateway forwards the WS
          `matchmaking_start` message to this endpoint.
        fields:
          - name: PlayerID
            type: string
            json: playerId
            tag: binding:"required"
            doc: Player UUID (plain UUID v4 string).
          - name: DeckID
            type: int64
            json: deckId
            tag: binding:"required"
            doc: Deck id the player queued with.
      - name: CancelRequest
        doc: |
          Body of POST /internal/v1/cancel. Idempotent — 200 on success,
          404 if the player was not in the queue.
        fields:
          - name: PlayerID
            type: string
            json: playerId
            tag: binding:"required"
            doc: Player UUID to dequeue.
      - name: QueueSizeResponse
        doc: Body of GET /internal/v1/queue-size.
        fields:
          - name: Size
            type: int64
            json: size
            doc: Current ZCARD of matchmaking:queue.

  - path: packages/api-matchmaking/events_gen.go
    package: apimatchmaking
    types:
      - name: MatchedPlayer
        doc: One player entry inside a MatchMadeEvent.
        fields:
          - name: PlayerID
            type: string
            json: playerId
            doc: Player UUID.
          - name: DeckID
            type: int64
            json: deckId
            doc: Deck id the player queued with.
      - name: MatchMadeEvent
        doc: |
          Pub/Sub message published to topic `matchmaking-events` when a
          pair of players is matched. Gateway subscriber は MatchID で
          インメモリ dedup する。
        fields:
          - name: Type
            type: string
            json: type
            doc: Event type discriminator, always "match_made".
          - name: MatchID
            type: string
            json: matchId
            doc: ULID-based match id, prefixed `mch_`. Dedup key on the gateway side.
          - name: Players
            type: "[]MatchedPlayer"
            json: players
            doc: Two-element slice — order reflects queue pop order.

  - path: packages/api-matchmaking/queue_gen.go
    package: apimatchmaking
    types:
      - name: QueueEntry
        doc: |
          In-memory view of one player in the Upstash Redis Sorted Set.
          Exposed for gateway integration tests — production writes stay
          inside the matchmaking service's internal queue package.
        fields:
          - name: PlayerID
            type: string
            json: playerId
            doc: Player UUID.
          - name: DeckID
            type: int64
            json: deckId
            doc: Deck id the player queued with.
          - name: JoinedAt
            type: time.Time
            json: joinedAt
            doc: ZADD timestamp.
