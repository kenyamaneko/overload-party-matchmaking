# post-merge image build & push は deploy.yaml に分離
name: CI

on:
  pull_request:
    branches: [main]
  workflow_call:
    outputs:
      code-changed:
        description: "'true' when the run touched code. The test results exist only then."
        value: ${{ jobs.changes.outputs.code }}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # main の run は GitHub Pages への deploy に繋がるため、後続の push で打ち切らない
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  id-token: write

jobs:
  changes:
    runs-on: ubicloud-standard-2
    timeout-minutes: 5
    outputs:
      code: ${{ steps.detect.outputs.changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Detect code change
        id: detect
        uses: kenyamaneko/overload-party-common/.github/actions/detect-code-change@main

  lint:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubicloud-standard-2
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Configure Go private modules
        uses: kenyamaneko/overload-party-common/.github/actions/setup-go-private-modules@main
        with:
          app-id: ${{ vars.CROSS_REPO_DEPS_APP_ID }}
          private-key: ${{ secrets.CROSS_REPO_DEPS_APP_PRIVATE_KEY }}
      # golangci-lint-action のビルド済みバイナリは Go 1.25 未対応のため
      # go install でソースからビルドして使う
      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.1.6
      - name: Run lint
        run: golangci-lint run --timeout 5m ./...
        env:
          GOPRIVATE: github.com/kenyamaneko/*

  test:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubicloud-standard-2
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Configure Go private modules
        uses: kenyamaneko/overload-party-common/.github/actions/setup-go-private-modules@main
        with:
          app-id: ${{ vars.CROSS_REPO_DEPS_APP_ID }}
          private-key: ${{ secrets.CROSS_REPO_DEPS_APP_PRIVATE_KEY }}
      - name: Run unit tests
        run: go test -race -count=1 ./... -json | tee go-test-unit.json
        env:
          GOPRIVATE: github.com/kenyamaneko/*
      - name: Report test results
        if: ${{ !cancelled() }}
        uses: kenyamaneko/overload-party-common/.github/actions/go-test-report@main
        with:
          json-path: go-test-unit.json
          title: 単体テスト結果
      # packages/api-matchmaking は別 go.mod (公開 SDK モジュール) のため go.work 上の
      # ワークスペース参照だけではルートの `go test ./...` に含まれず、明示的に走らせる。
      - name: Run api-matchmaking unit tests
        working-directory: packages/api-matchmaking
        run: go test -race -count=1 ./... -json | tee ../../go-test-unit-api-matchmaking.json
      - name: Report api-matchmaking test results
        if: ${{ !cancelled() }}
        uses: kenyamaneko/overload-party-common/.github/actions/go-test-report@main
        with:
          json-path: go-test-unit-api-matchmaking.json
          title: api-matchmaking 単体テスト結果
          module-dir: packages/api-matchmaking
      # 同一 run 内でテスト観点カタログを組むためだけに使うので保持は最短にする
      - name: Upload unit test results
        uses: actions/upload-artifact@v4
        with:
          name: go-test-unit
          path: |
            go-test-unit.json
            go-test-unit-api-matchmaking.json
          retention-days: 1

  test-integration:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubicloud-standard-2
    timeout-minutes: 30
    # redisqueue パッケージの integration テストは実 Redis に接続するため、
    # localhost:6379 で listen する Redis service container を提供する。
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Configure Go private modules
        uses: kenyamaneko/overload-party-common/.github/actions/setup-go-private-modules@main
        with:
          app-id: ${{ vars.CROSS_REPO_DEPS_APP_ID }}
          private-key: ${{ secrets.CROSS_REPO_DEPS_APP_PRIVATE_KEY }}
      - name: Run integration tests
        run: go test -race -count=1 -tags=integration ./... -json | tee go-test-integration.json
        env:
          GOPRIVATE: github.com/kenyamaneko/*
      - name: Report test results
        if: ${{ !cancelled() }}
        uses: kenyamaneko/overload-party-common/.github/actions/go-test-report@main
        with:
          json-path: go-test-integration.json
          title: 結合テスト結果
      # 同一 run 内でテスト観点カタログを組むためだけに使うので保持は最短にする
      - name: Upload integration test results
        uses: actions/upload-artifact@v4
        with:
          name: go-test-integration
          path: go-test-integration.json
          retention-days: 1

  codegen-sync:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubicloud-standard-2
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Configure private repo auth
        # pip install で git+https://github.com/kenyamaneko/... を clone するために
        # token-based 認証 (insteadOf) を git config に注入する。
        uses: kenyamaneko/overload-party-common/.github/actions/setup-go-private-modules@main
        with:
          app-id: ${{ vars.CROSS_REPO_DEPS_APP_ID }}
          private-key: ${{ secrets.CROSS_REPO_DEPS_APP_PRIVATE_KEY }}
      - name: Install asyncapi-codegen-tools
        run: |
          pip install \
            "overload-party-codegen-tools @ git+https://github.com/kenyamaneko/overload-party-common.git@main#subdirectory=packages/codegen-tools" \
            "overload-party-asyncapi-codegen-tools @ git+https://github.com/kenyamaneko/overload-party-common.git@main#subdirectory=packages/asyncapi-codegen-tools"
      - name: Install oapi-codegen
        run: go install github.com/oapi-codegen/oapi-codegen/v2/cmd/oapi-codegen@v2.7.0
      - name: Run codegen (OpenAPI + AsyncAPI)
        run: scripts/generate_types.sh
      - name: Check for drift
        run: .github/scripts/ci/check-codegen-drift.sh
