name: Publish packages/api-matchmaking

# 桁は後方互換を壊すかどうかの判断であり変更内容から導けないため、人が選んで実行する。
on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump level"
        required: true
        default: "patch"
        type: choice
        options:
          - patch
          - minor
          - major

concurrency:
  group: publish-${{ github.ref }}
  # タグの採番が競合しないように、先行ジョブの完了を待つ
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    name: Tag Go module
    runs-on: ubicloud-standard-2
    timeout-minutes: 15
    env:
      GOWORK: "off"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: packages/api-matchmaking/go.mod

      - name: go vet + build
        working-directory: packages/api-matchmaking
        run: |
          go vet ./...
          go build ./...

      - name: Compute next version
        id: version
        env:
          PREFIX: packages/api-matchmaking/v
          BUMP: ${{ inputs.bump }}
        run: .github/scripts/publish/next-tag.sh

      - name: Push tag
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: .github/scripts/publish/tag-and-push.sh
